<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ritik Sharma | Portfolio</title>
    <meta name="robots" content="noindex, follow">
    <script type="text/javascript">
      // GitHub Pages serves this file for unknown paths (with a 404 status).
      // Encode the requested path into a query string and hand it to the SPA,
      // which restores it via history.replaceState in index.html.
      // segmentCount = number of path segments in the deploy base
      // (1 for https://<user>.github.io/<repo>/, 0 for a custom domain root).
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>

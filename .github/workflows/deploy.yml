name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set base URL
        id: base
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "base=/ritiksharma.github.io/preview/${{ github.event.pull_request.number }}/" >> $GITHUB_OUTPUT
          else
            echo "base=/ritiksharma.github.io/" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm install
      - name: Build site
        run: npm run build 2>&1 | tee build.log
        env:
          VITE_BASE_URL: ${{ steps.base.outputs.base }}
      - name: Upload failure logs & artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            npm-debug.log*
            ./dist
          if-no-files-found: ignore
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && format('github-pages-preview-{0}', github.event.pull_request.number) || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: ${{ github.event_name == 'pull_request' }}
